  // Handle quoted reply
  let finalText = text;
  if (hasQuote) {
    finalText = text ? `[引用：「${state.quoteContext.substring(0, 50)}」]\n${text}` : `[引用：「${state.quoteContext.substring(0, 50)}」]`;
    state.quoteContext = null;
    const quoteBar = document.getElementById('quote-bar');
    if (quoteBar) quoteBar.style.display = 'none';
  }

  // Empty text + no quote = "continue" prompt: ask AI to say one more line
  if (!text && !hasQuote) {
    // Don't add a user message, just prompt AI to continue
    state.isLoading = true;
    btn.disabled = true;
    showTypingIndicator();
    try {
      const reply = await callAI('（系统提示：对方没有回复，你紧接着又会说一句话。请直接输出这句话，不要加任何说明或引号，不要重复已经说过的话，内容要自然衔接上一句。）', 'chat');
      removeTypingIndicator();
      const cleanReply = reply.trim();
      if (cleanReply) {
        state.data.chatHistory.push({
          role: 'assistant', content: cleanReply,
          timestamp: Date.now(), sessionId: state.chatSessionId
        });
        saveToStorage();
        appendChatMessage(state.data.chatHistory.length - 1);
      }
    } catch(e) {
      removeTypingIndicator();
      showToast('AI回复失败：' + (e.message || '未知错误'));
    } finally {
      state.isLoading = false;
      btn.disabled = false;
      input.focus();
    }
    return;
  }

  // Normal send: add user message, AI replies once
  state.data.chatHistory.push({
    role: 'user', content: text,
    timestamp: Date.now(), sessionId: state.chatSessionId
  });
  input.value = '';
  saveToStorage();
  appendChatMessage(state.data.chatHistory.length - 1);

  state.isLoading = true;
  btn.disabled = true;

  try {
    showTypingIndicator();
    const reply = await callAI(finalText, 'chat');
    removeTypingIndicator();

    const cleanReply = reply.trim();
    if (cleanReply) {
      state.data.chatHistory.push({
        role: 'assistant', content: cleanReply,
        timestamp: Date.now(), sessionId: state.chatSessionId
      });
      saveToStorage();
      appendChatMessage(state.data.chatHistory.length - 1);
    }
  } catch(e) {
    removeTypingIndicator();
    showToast('AI回复失败：' + (e.message || '未知错误'));
    state.data.chatHistory.push({
      role: 'assistant', content: '（回复失败，请检查API配置）',
      timestamp: Date.now(), sessionId: state.chatSessionId
    });
    saveToStorage();
    appendChatMessage(state.data.chatHistory.length - 1);
  } finally {
    state.isLoading = false;
    btn.disabled = false;
    input.focus();
  }
}

/* ========== 消息操作（引用/删除） ========== */
function showMsgActions(idx) {
  // Remove any existing menu
  const existing = document.getElementById('msg-action-menu');
  if (existing) existing.remove();

  const msg = state.data.chatHistory[idx];
  if (!msg) return;

  const isMe = msg.role === 'user';
  const menu = document.createElement('div');
  menu.id = 'msg-action-menu';
  menu.className = 'msg-action-menu';
  menu.innerHTML = `
    <button class="msg-action-item" onclick="quoteMessage(${idx})">引用</button>
    <button class="msg-action-item" onclick="editMessage(${idx})">编辑</button>
  `;
  document.body.appendChild(menu);
  menu.classList.add('active');

  // Position near the clicked message
  const msgEl = document.querySelector(`.msg-row[data-idx="${idx}"]`);
  if (msgEl) {
    const rect = msgEl.getBoundingClientRect();
    const menuRect = menu.getBoundingClientRect();
    let top = rect.bottom + 4;
    if (top + menuRect.height > window.innerHeight - 10) {
      top = rect.top - menuRect.height - 4;
    }
    menu.style.top = top + 'px';
    if (isMe) {
      menu.style.right = (window.innerWidth - rect.right + 42) + 'px';
      menu.style.left = 'auto';
    } else {
      menu.style.left = (rect.left + 42) + 'px';
      menu.style.right = 'auto';
    }
  }
}

function closeMsgActions() {
  const menu = document.getElementById('msg-action-menu');
  if (menu) menu.remove();
}

function quoteMessage(idx) {
  const msg = state.data.chatHistory[idx];
  if (!msg) return;
  closeMsgActions();
  state.quoteContext = msg.content;
  const quoteBar = document.getElementById('quote-bar');
  if (quoteBar) {
    const preview = msg.content.length > 40 ? msg.content.substring(0, 40) + '...' : msg.content;
    quoteBar.querySelector('.quote-bar-text').textContent = preview;
    quoteBar.style.display = 'flex';
  }
  document.getElementById('chat-input')?.focus();
}

function cancelQuote() {
  state.quoteContext = null;
  const quoteBar = document.getElementById('quote-bar');
  if (quoteBar) quoteBar.style.display = 'none';
}

function editMessage(idx) {
  const msg = state.data.chatHistory[idx];
  if (!msg) return;
  closeMsgActions();
  const oldContent = msg.content;

  showModal(`
    <div class="modal">
      <div class="modal-header">编辑消息</div>
      <div class="modal-body" style="padding:16px;">
        <textarea id="edit-msg-area" style="width:100%;min-height:120px;background:rgba(15,26,43,0.75);border:1px solid rgba(131,147,168,0.15);color:var(--text);font-size:14.5px;line-height:1.6;padding:12px;resize:vertical;outline:none;border-radius:0;font-family:inherit;">${escapeHtml(oldContent)}</textarea>
      </div>
      <div class="modal-footer">
        <button class="modal-btn" onclick="closeModal()">取消</button>
        <button class="modal-btn primary" onclick="doSaveMessage(${idx})">保存</button>
      </div>
    </div>
  `);
  setTimeout(() => {
    const ta = document.getElementById('edit-msg-area');
    if (ta) {
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
    }
  }, 50);
}

function doSaveMessage(idx) {
  const ta = document.getElementById('edit-msg-area');
  if (!ta) { closeModal(); return; }
  const newContent = ta.value.trim();
  const oldContent = state.data.chatHistory[idx] ? state.data.chatHistory[idx].content : '';
  if (newContent && newContent !== oldContent) {
    state.data.chatHistory[idx].content = newContent;
    saveToStorage();
    updateChatMessageBubble(idx);
  }
  closeModal();
}

// Close menu when clicking outside
document.addEventListener('click', function(e) {
  const menu = document.getElementById('msg-action-menu');
  if (menu && !menu.contains(e.target) && !e.target.closest('.msg-row')) {
    menu.remove();
  }
});

/* ========== 羁绊页 ========== */
function buildEventBlockHtml(evt) {
  const hasPlayer = evt.polishedWish || evt.wish;
  const hasAi = evt.aiNarrative;
  const playerBody = evt.polishedWish ? formatNarrativeText(evt.polishedWish) : (evt.wish ? formatNarrativeText(evt.wish) : '');
  const aiBody = evt.aiNarrative ? formatNarrativeText(evt.aiNarrative) : '';
  let html = `<div class="narrative-block" data-id="${evt.id}">`;
  if (hasPlayer) {
    html += `
      <div class="narr-card player">
        <div class="narr-card-header">
          <span class="narr-card-tag">愿望</span>
          <div class="narr-card-header-actions">
            <button class="narr-card-header-btn" onclick="editNarrative('${evt.id}','player')">EDIT</button>
            <button class="narr-card-header-btn" onclick="refreshNarrative('${evt.id}','player')">RETRY</button>
            <button class="narr-card-header-btn danger" onclick="deleteNarrative('${evt.id}','player')">DELETE</button>
          </div>
        </div>
        <div class="narr-card-body" id="player-narr-${evt.id}">${playerBody}</div>
        <div class="narr-card-actions" id="player-actions-${evt.id}"></div>
      </div>`;
  }
  if (hasAi) {
    html += `
      <div class="narr-card ai">
        <div class="narr-card-header">
          <span class="narr-card-tag">叙事</span>
          <div class="narr-card-header-actions">
            <button class="narr-card-header-btn" onclick="editNarrative('${evt.id}','ai')">EDIT</button>
            <button class="narr-card-header-btn" onclick="refreshNarrative('${evt.id}','ai')">RETRY</button>
            <button class="narr-card-header-btn danger" onclick="deleteNarrative('${evt.id}','ai')">DELETE</button>
          </div>
        </div>
        <div class="narr-card-body" id="ai-narr-${evt.id}">${aiBody}</div>
        <div class="narr-card-actions" id="ai-actions-${evt.id}"></div>
      </div>`;
  }
  html += `</div>`;
  return html;
}

function buildBondsStateHtml() {
  const events = state.data.eventHistory;
  if (state.eventState === 'idle' || state.eventState === 'ended') {
    if (events.length === 0) {
      return `
        <div class="bonds-idle">
          <div class="bonds-idle-text">投递一张事件卡<br>让AI为你展开叙事</div>
          <button class="event-card-btn" onclick="startEventInput()">投递事件卡</button>
        </div>
      `;
    } else {
      return `
        <div class="bonds-idle" style="flex:0;padding:12px 0;">
          <button class="event-card-btn" onclick="startEventInput()">投递事件卡</button>
        </div>
      `;
    }
  } else if (state.eventState === 'generating') {
    return `<div class="bonds-loading">润色中<span class="dots"><span></span><span></span><span></span></span></div>`;
  }
  // 'input' and 'active' states have no content here — the input bar handles them
  return '';
}

function renderBondsContent() {
  const container = document.getElementById('bonds-content');
  const events = state.data.eventHistory;

  let html = '';

  // Render all existing events
  events.forEach(evt => {
    html += buildEventBlockHtml(evt);
  });

  // State UI at the bottom (separate element for incremental updates)
  html += `<div id="bonds-state-ui">${buildBondsStateHtml()}</div>`;

  container.innerHTML = html;
  container.scrollTop = container.scrollHeight;
}

// Incrementally append a single event block without rebuilding the rest
function appendBondsEvent(evtId) {
  const container = document.getElementById('bonds-content');
  const evt = state.data.eventHistory.find(e => e.id === evtId);
  if (!evt || !container) return;

  const stateUi = document.getElementById('bonds-state-ui');
  const eventHtml = buildEventBlockHtml(evt);

  // Insert before the state UI element, or append to end
  if (stateUi) {
    stateUi.insertAdjacentHTML('beforebegin', eventHtml);
  } else {
    container.insertAdjacentHTML('beforeend', eventHtml);
  }

  container.scrollTop = container.scrollHeight;
}

// Update only the bottom state UI (idle button / loading) without rebuilding event blocks
function updateBondsStateUI() {
  const stateUi = document.getElementById('bonds-state-ui');
  if (stateUi) {
    stateUi.innerHTML = buildBondsStateHtml();
  } else {
    const container = document.getElementById('bonds-content');
    if (container) container.insertAdjacentHTML('beforeend', `<div id="bonds-state-ui">${buildBondsStateHtml()}</div>`);
  }
  const container = document.getElementById('bonds-content');
  if (container) container.scrollTop = container.scrollHeight;
}

function renderBondsInput() {
  const inputArea = document.getElementById('bonds-input-area');

  if (state.eventState === 'idle' || state.eventState === 'ended') {
    inputArea.innerHTML = '';
  } else if (state.eventState === 'input') {
    // Only rebuild if not already in input/active state with an input element
    const existingInput = inputArea.querySelector('#event-input');
    if (!existingInput) {
      inputArea.innerHTML = `
        <input type="text" id="event-input" placeholder="写下你的剧情愿望..." onkeydown="if(event.key==='Enter')sendEventWish()">
        <button onmousedown="event.preventDefault()" onclick="sendEventWish()">投递</button>
      `;
    } else {
      // Already has input — just ensure placeholder matches and no exit button
      existingInput.placeholder = '写下你的剧情愿望...';
      const exitBtn = inputArea.querySelector('button.danger');
      if (exitBtn) exitBtn.remove();
    }
  } else if (state.eventState === 'active') {
    // Only rebuild if no input element exists yet
    const existingInput = inputArea.querySelector('#event-input');
    if (!existingInput) {
      inputArea.innerHTML = `
        <input type="text" id="event-input" placeholder="继续投递剧情愿望..." onkeydown="if(event.key==='Enter')sendEventWish()">
        <button onmousedown="event.preventDefault()" onclick="sendEventWish()">投递</button>
        <button class="danger" onclick="exitEvent()">退出</button>
      `;
    } else {
      // Already has input — transition from input to active: update placeholder, add exit button
      existingInput.placeholder = '继续投递剧情愿望...';
      if (!inputArea.querySelector('button.danger')) {
        const exitBtn = document.createElement('button');
        exitBtn.className = 'danger';
        exitBtn.textContent = '退出';
        exitBtn.onclick = exitEvent;
        inputArea.appendChild(exitBtn);
      }
    }
  }
  // Note: 'generating' state does NOT touch inputArea — preserves the existing
  // input element and its focus so the keyboard stays open.
}

function renderBonds() {
  renderBondsContent();
  renderBondsInput();
}

function startEventInput() {
  state.eventState = 'input';
  // Incremental update: only refresh state UI and input bar, not event blocks
  updateBondsStateUI();
  renderBondsInput();
}

async function sendEventWish() {
  const input = document.getElementById('event-input');
  if (!input) return;
  const wish = input.value.trim();
  if (!wish || state.isLoading) return;

  // Clear input but keep focus to retain keyboard
  input.value = '';

  state.isLoading = true;
  state.eventState = 'generating';
  // Incremental: only update the state UI (loading indicator), do NOT rebuild event blocks
  updateBondsStateUI();

  const evtId = 'evt_' + Date.now();
  const chainId = state.currentChainId || ('chain_' + Date.now());
  state.currentChainId = chainId;

  try {
    // Generate sequentially: polish first, then narrative uses polished text as context
    const polished = await callAI(wish, 'polish');
    const narrative = await callAI(
      `【玩家的剧情愿望】\n${wish}\n\n【润色后的愿望文本】\n${polished}\n\n请基于以上内容生成第三人称叙事文段，叙事要自然衔接润色后的文本。`,
      'event'
    );

    state.data.eventHistory.push({
      id: evtId,
      chainId: chainId,
      wish: wish,
      aiNarrative: narrative,
      polishedWish: polished,
      timestamp: Date.now()
    });
    saveToStorage();
    state.eventState = 'active';
    // Incrementally append the new event block (no full re-render)
    appendBondsEvent(evtId);
    // Update state UI to clear loading indicator
    updateBondsStateUI();
    // Update input bar to show active state
    renderBondsInput();
  } catch(e) {
    showToast('生成失败：' + (e.message || '未知错误'));
    state.eventState = 'input';
    updateBondsStateUI();
    renderBondsInput();
  } finally {
    state.isLoading = false;
    // Refocus input to keep keyboard visible after generation completes
    const newInput = document.getElementById('event-input');
    if (newInput) newInput.focus();
  }
}

function exitEvent() {
  state.eventState = 'ended';
  state.currentChainId = null;
  // Incremental: only update state UI and input bar, not event blocks
  updateBondsStateUI();
  renderBondsInput();
  showToast('事件链已结束，历史已保留');
}

function editNarrative(evtId, side) {
  const evt = state.data.eventHistory.find(e => e.id === evtId);
  if (!evt) return;
  const currentText = side === 'ai' ? evt.aiNarrative : evt.polishedWish;
  const sideText = side === 'ai' ? '叙事' : '愿望';

  showModal(`
    <div class="modal">
      <div class="modal-header">编辑${sideText}</div>
      <div class="modal-body" style="padding:16px;">
        <textarea id="edit-narr-area" style="width:100%;min-height:200px;background:rgba(15,26,43,0.75);border:1px solid rgba(131,147,168,0.15);color:var(--text);font-size:14px;line-height:1.8;padding:12px;resize:vertical;outline:none;border-radius:0;font-family:inherit;">${escapeHtml(currentText)}</textarea>
      </div>
      <div class="modal-footer">
        <button class="modal-btn" onclick="closeModal()">取消</button>
        <button class="modal-btn primary" onclick="doSaveNarrativeEdit('${evtId}','${side}')">保存</button>
      </div>
    </div>
  `);
  setTimeout(() => {
    const ta = document.getElementById('edit-narr-area');
    if (ta) {
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
    }
  }, 50);
}

function doSaveNarrativeEdit(evtId, side) {
  const ta = document.getElementById('edit-narr-area');
  if (!ta) { closeModal(); return; }
  const evt = state.data.eventHistory.find(e => e.id === evtId);
  if (!evt) { closeModal(); return; }
  if (side === 'ai') evt.aiNarrative = ta.value;
  else evt.polishedWish = ta.value;
  saveToStorage();
  // Update the single card body without full re-render
  const boxId = side === 'ai' ? `ai-narr-${evtId}` : `player-narr-${evtId}`;
  const box = document.getElementById(boxId);
  if (box) {
    const body = side === 'ai' ? evt.aiNarrative : evt.polishedWish;
    box.innerHTML = body ? formatNarrativeText(body) : '<span style="color:var(--text-faint);font-style:italic;">（已删除）</span>';
  }
  closeModal();
  showToast('已保存');
}

async function refreshNarrative(evtId, side) {
  const sideText = side === 'ai' ? '叙事' : '愿望';
  showModal(`
    <div class="modal">
      <div class="modal-header">重新生成${sideText}</div>
      <div class="modal-body" style="text-align:center;color:var(--text-dim);font-size:13px;">
        确定要重新生成这条${sideText}吗？当前内容将被覆盖。
      </div>
      <div class="modal-footer">
        <button class="modal-btn" onclick="closeModal()">取消</button>
        <button class="modal-btn primary" onclick="closeModal();doRefreshNarrative('${evtId}','${side}')">确认</button>
      </div>
    </div>
  `);
}

async function doRefreshNarrative(evtId, side) {
  const evt = state.data.eventHistory.find(e => e.id === evtId);
  if (!evt) return;
  if (state.isLoading) return;

  state.isLoading = true;
  const boxId = side === 'ai' ? `ai-narr-${evtId}` : `player-narr-${evtId}`;
  const box = document.getElementById(boxId);
  if (box) box.innerHTML = `<div class="bonds-loading" style="padding:8px;">重新生成<span class="dots"><span></span><span></span><span></span></span></div>`;

  try {
    if (side === 'ai') {
      evt.aiNarrative = await callAI(evt.wish, 'event');
    } else {
      evt.polishedWish = await callAI(evt.wish, 'polish');
    }
    saveToStorage();
    // Only update the single card body (no full re-render)
    if (box) {
      const body = side === 'ai' ? evt.aiNarrative : evt.polishedWish;
      box.innerHTML = body ? formatNarrativeText(body) : '<span style="color:var(--text-faint);font-style:italic;">（已删除）</span>';
    }
  } catch(e) {
    showToast('重新生成失败：' + (e.message || '未知错误'));
    // Restore original content on failure
    if (box) {
      const body = side === 'ai' ? evt.aiNarrative : evt.polishedWish;
      box.innerHTML = body ? formatNarrativeText(body) : '<span style="color:var(--text-faint);font-style:italic;">（已删除）</span>';
    }
  } finally {
    state.isLoading = false;
  }
}

function deleteNarrative(evtId, side) {
  const sideText = side === 'ai' ? '叙事' : '愿望';
  showModal(`
    <div class="modal">
      <div class="modal-header">删除${sideText}</div>
      <div class="modal-body" style="text-align:center;color:var(--text-dim);font-size:13px;">
        确定要删除这条${sideText}吗？删除后不可恢复。
      </div>
      <div class="modal-footer">
        <button class="modal-btn" onclick="closeModal()">取消</button>
        <button class="modal-btn primary" onclick="closeModal();doDeleteNarrative('${evtId}','${side}')">确认删除</button>
      </div>
    </div>
  `);
}

function doDeleteNarrative(evtId, side) {
  const evt = state.data.eventHistory.find(e => e.id === evtId);
  if (!evt) return;
  // Clear the deleted side's content
  if (side === 'ai') {
    evt.aiNarrative = '';
  } else {
    evt.polishedWish = '';
    evt.wish = '';
  }

  // Remove the corresponding card element from DOM (no full re-render)
  const blockEl = document.querySelector(`.narrative-block[data-id="${evtId}"]`);
  if (blockEl) {
    const cardEl = blockEl.querySelector(side === 'ai' ? '.narr-card.ai' : '.narr-card.player');
    if (cardEl) cardEl.remove();
  }

  // If both sides are now empty, remove the entire event block from data
  if (!evt.polishedWish && !evt.wish && !evt.aiNarrative) {
    const idx = state.data.eventHistory.findIndex(e => e.id === evtId);
    if (idx !== -1) state.data.eventHistory.splice(idx, 1);
    if (blockEl) blockEl.remove();
    if (state.data.eventHistory.length === 0) {
      updateBondsStateUI();
    }
  }
  saveToStorage();
  showToast('已删除');
}

/* ========== 记忆页 ========== */
function buildMemoryCardHtml(card) {
  return `
    <div class="memory-card" data-id="${card.id}">
      <div class="memory-card-header">
        <span class="memory-card-time">${formatTime(card.timestamp)}</span>
      </div>
      <div class="memory-card-text" id="mem-text-${card.id}">${escapeHtml(card.content)}</div>
      <div class="memory-card-actions">
        <button class="mem-action-btn" onclick="editMemoryCard('${card.id}')">编辑</button>
        <button class="mem-action-btn" onclick="regenerateMemoryCard('${card.id}')">重新生成</button>
        <button class="mem-action-btn danger" onclick="deleteMemoryCard('${card.id}')">删除</button>
      </div>
    </div>
  `;
}

function renderMemory() {
  const container = document.getElementById('memory-cards');
  const cards = state.data.memoryCards;

  if (cards.length === 0) {
    container.innerHTML = `<div class="memory-empty">暂无记忆卡片<br><span style="font-size:11px;color:rgba(131,147,168,0.55)">点击下方按钮生成记忆摘要</span></div>`;
    return;
  }

  let html = '<div class="memory-timeline">';
  cards.forEach(card => {
    html += buildMemoryCardHtml(card);
  });
  html += '</div>';
  container.innerHTML = html;
}

// Incrementally append a single memory card without rebuilding the rest
function appendMemoryCard(cardId) {
  const container = document.getElementById('memory-cards');
  const card = state.data.memoryCards.find(c => c.id === cardId);
  if (!card || !container) return;

  // Remove empty placeholder if present
  const emptyEl = container.querySelector('.memory-empty');
  if (emptyEl) {
    container.innerHTML = '<div class="memory-timeline"></div>';
  }

  const timeline = container.querySelector('.memory-timeline');
  if (timeline) {
    timeline.insertAdjacentHTML('beforeend', buildMemoryCardHtml(card));
  } else {
    container.innerHTML = `<div class="memory-timeline">${buildMemoryCardHtml(card)}</div>`;
  }
}

// Remove a single memory card from DOM without full re-render
function removeMemoryCard(cardId) {
  const cardEl = document.querySelector(`.memory-card[data-id="${cardId}"]`);
  if (cardEl) cardEl.remove();
  // If no cards left, show empty placeholder
  const container = document.getElementById('memory-cards');
  if (container && !container.querySelector('.memory-card')) {

}

async function improveMemory() {
  const btn = document.getElementById('improve-memory-btn');
  if (state.isLoading) return;

  const since = state.data.lastMemoryUpdate || 0;
  const recentChats = state.data.chatHistory.filter(h => h.timestamp > since);
  const recentEvents = state.data.eventHistory.filter(h => h.timestamp > since);

  if (recentChats.length === 0 && recentEvents.length === 0) {
    showToast('没有新的对话记录需要总结');
    return;
  }

  state.isLoading = true;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';

  let summary = '请总结以下记录的关键信息：\n\n';
  summary += '【聊天记录】\n';
  recentChats.forEach(h => {
    summary += `${h.role === 'user' ? '主控' : '角色'}：${h.content}\n`;
  });
  summary += '\n【事件记录】\n';
  recentEvents.forEach(e => {
    summary += `愿望：${e.wish}\n叙事：${e.aiNarrative}\n\n`;
  });

  try {
    const result = await callAI(summary, 'memory');
    const cardId = 'mem_' + Date.now();
    state.data.memoryCards.push({
      id: cardId,
      content: result,
      timestamp: Date.now(),
      sourceChats: recentChats.length,
      sourceEvents: recentEvents.length
    });
    state.data.lastMemoryUpdate = Date.now();
    saveToStorage();
    // Incrementally append the new card (no full re-render)
    appendMemoryCard(cardId);
    showToast('记忆已完善');
    // Auto-save to slot_auto when memory is improved (failure won't affect the main flow)
    const autoOk = autoSave();
    if (!autoOk) {
      showToast('记忆已完善（自动存档失败：空间不足）');
    }
  } catch(e) {
    showToast('生成失败：' + (e.message || '未知错误'));
  } finally {
    state.isLoading = false;
    btn.disabled = false;
    btn.textContent = '完善记忆';
  }
}

function formatSecretRecordTime(timestamp) {
  const d = new Date(timestamp);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日  ${pad(d.getHours())}：${pad(d.getMinutes())}`;
}

function buildSecretRecordCardHtml(rec) {
  const typeName = SECRET_TYPE_NAMES[rec.type] || rec.type;
  return `
    <div class="secret-record-card" data-id="${rec.id}" onclick="viewSecretRecord('${rec.id}')" style="cursor:pointer;">
      <div class="secret-record-card-header">
        <div class="secret-record-card-title">

function buildSecretContext() {
  let ctx = '';
  const me = state.data.characters.me.name || '主控';
  const other = state.data.characters.other.name || 'TA';

  // Recent conversations - real-time dialogue context
  const recentChats = state.data.chatHistory.slice(-15);
  if (recentChats.length) {
    ctx += '\n【近期对话记录（你的真实生活动态）】\n';
    recentChats.forEach(msg => {
      const speaker = msg.role === 'user' ? me : other;
      ctx += `${speaker}：${msg.content}\n`;
    });
  } else {
    ctx += '\n【近期对话记录】暂无对话，你们还没有开始交流。\n';
  }

  // Recent events - story context
  const recentEvents = state.data.eventHistory.slice(-4);
  if (recentEvents.length) {
    ctx += '\n【近期经历的事件】\n';
    recentEvents.forEach(evt => {
      const narrative = evt.aiNarrative ? evt.aiNarrative.substring(0, 120) : '';
      ctx += `- ${evt.wish}（${narrative}...）\n`;
    });
  }

  // Current real time
  const now = new Date();
  const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
  const timeStr = `${now.getMonth()+1}月${now.getDate()}日 ${weekdays[now.getDay()]} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
  ctx += `\n【当前现实时间】${timeStr}\n`;

  return ctx;
}

async function generateMemo(charName) {
  const listEl = document.getElementById('secret-detail-list');
  const context = buildSecretContext();
  const prompt = `此刻你刚放下手机，有人偷偷翻看了你的备忘录。\n请根据以下你近期的真实生活动态，生成你备忘录里此刻真实存在的3-5条内容。\n内容要与近期经历、心情、人际关系紧密相关，像真实生活在继续一样。\n${context}\n\n请直接输出备忘录内容，不要加任何说明。`;

  const genId = ++state.secretGenId;
  try {
    const result = await callAI(prompt, 'secret-memo');
    // Stale check: if a newer generation started, ignore this result
    if (genId !== state.secretGenId) return;
    // Normalize: replace newlines with ||| so both \n and ||| work as separators
    const normalized = result.replace(/\r?\n/g, '|||');
    const items = normalized.split('|||').map(s => s.trim()).filter(s => s);
    let html = '';
    // Only process complete groups of 3 (title, text, time)
    const groupCount = Math.floor(items.length / 3);
    for (let g = 0; g < groupCount; g++) {
      const i = g * 3;
      const title = items[i].replace(/\s+/g, ' ');
      const text = items[i + 1].replace(/\s+/g, ' ');
      const time = items[i + 2].replace(/\s+/g, ' ');
      html += `
        <div class="memo-item">
          <div class="memo-item-header">
            <div class="memo-item-time">${escapeHtml(time)}</div>
            <div class="memo-item-sep">｜</div>
            <div class="memo-item-title">${escapeHtml(title)}</div>
          </div>
          <div class="memo-item-text">${escapeHtml(text)}</div>
        </div>
      `;
    }
    listEl.className = '';
    listEl.innerHTML = html || '<div class="secret-loading">暂无内容</div>';
    // Cache the result + show action buttons ONLY after content is ready
    if (html && state.secretModuleType === 'memo') {
      if (!state.secretCache) state.secretCache = {};
      state.secretCache.memo = html;
      showSecretActions('memo', html);
    }
  } catch(e) {
    if (genId !== state.secretGenId) return;
    listEl.className = '';
    listEl.innerHTML = `<div class="secret-loading">${escapeHtml(e.message || '生成失败，请检查API配置')}<br><button class="settings-action-btn" style="margin-top:12px;width:120px;" onclick="retrySecretGen('memo')">重试</button></div>`;
  }
}

    // Normalize: replace newlines with ||| so both \n and ||| work as separators
    const normalized = result.replace(/\r?\n/g, '|||');

    // Only process complete groups of 3 (title, url, time)

    if (genId !== state.secretGenId) return;
    const errHtml = `<div class="secret-loading">${escapeHtml(e.message || '生成失败，请检查API配置')}<br><button class="settings-action-btn" style="margin-top:12px;width:120px;" onclick="retrySecretGen('${tab}')">重试</button></div>`;
    // Don't cache errors — allow retry on next open
    if (state.secretModuleType === tab && listEl) {
      listEl.className = '';
      listEl.innerHTML = errHtml;
    }
  }
}

function retrySecretGen(type) {
  const charName = state.data.characters.other.name || '他';
  if (type === 'memo') generateMemo(charName);
  else if (type === 'mailbox') generateMailbox(charName);
  else if (type === 'cart') generateCart(charName);
  else generateHistory(charName, type); // footprint / bookmark
}

async function generateMailbox(charName) {
  const listEl = document.getElementById('secret-detail-list');
  const context = buildSecretContext();
  const prompt = `此刻你刚放下手机，有人偷偷翻看了你的短信信箱。\n请根据以下你近期的真实生活动态，生成你手机短信信箱里此刻真实存在的3-5条短信。\n既有你主动发出的，也有别人发给你的，混合呈现。\n至少有1-2条与主控角色之间的短信，呼应你们近期的关系状态。\n${context}\n\n请直接输出短信内容，不要加任何说明。`;

  const genId = ++state.secretGenId;
  try {
    const result = await callAI(prompt, 'secret-mail');
    if (genId !== state.secretGenId) return;
    // Normalize: replace newlines with ||| so both \n and ||| work as separators
    const normalized = result.replace(/\r?\n/g, '|||');
    const items = normalized.split('|||').map(s => s.trim()).filter(s => s);
    let html = '';
    // Only process complete groups of 4 (direction, party, text, time)
    const groupCount = Math.floor(items.length / 4);
    for (let g = 0; g < groupCount; g++) {
      const i = g * 4;
      const direction = items[i].replace(/\s+/g, ' ');
      const party = items[i + 1].replace(/\s+/g, ' ');
      const text = items[i + 2].replace(/\s+/g, ' ');
      const time = items[i + 3].replace(/\s+/g, ' ');
      const isSent = direction.includes('发出');
      html += `
        <div class="mail-item ${isSent ? 'sent' : 'received'}">
          <div class="mail-item-header">
            <span class="mail-item-direction ${isSent ? 'sent' : 'received'}">${isSent ? '↗ 发出' : '↙ 收到'}</span>
            <span class="mail-item-party">${escapeHtml(party)}</span>
            <span class="mail-item-time">${escapeHtml(time)}</span>
          </div>
          <div class="mail-item-text">${escapeHtml(text)}</div>
        </div>
      `;
    }
    listEl.className = '';
    listEl.innerHTML = html || '<div class="secret-loading">暂无内容</div>';
    if (html && state.secretModuleType === 'mailbox') {
      if (!state.secretCache) state.secretCache = {};
      state.secretCache.mailbox = html;
      showSecretActions('mailbox', html);
    }
  } catch(e) {
    if (genId !== state.secretGenId) return;
    listEl.className = '';
    listEl.innerHTML = `<div class="secret-loading">${escapeHtml(e.message || '生成失败，请检查API配置')}<br><button class="settings-action-btn" style="margin-top:12px;width:120px;" onclick="retrySecretGen('mailbox')">重试</button></div>`;
  }
}

async function generateCart(charName) {
  const listEl = document.getElementById('secret-detail-list');
  const context = buildSecretContext();
  const prompt = `此刻你刚放下手机，有人偷偷查看了你手机购物APP里的购物车、运输中、寄退和历史订单。\n请根据以下你近期的真实生活动态，生成你此刻真实的购物数据，分为四个板块。\n${context}\n\n请直接输出购物数据，不要加任何说明。`;

  const genId = ++state.secretGenId;
  try {
    const result = await callAI(prompt, 'secret-cart');
    if (genId !== state.secretGenId) return;

    // Normalize newlines to ||| within the raw result for easier parsing
    const normalized = result.replace(/\r?\n/g, '|||');

    // Split into sections by 【section_name】 markers
    // Use a unique delimiter to avoid fragile position math
    const sectionMap = {};
    const delim = '\u0001SEC\u0001';
    const delimited = normalized.replace(/【(购物车|运输中|寄退|历史订单)】\|\|\|?/g, (m, name) => delim + name + delim);
    const parts = delimited.split(delim);
    // parts[0] = before first section (empty), then alternating: name, content, name, content, ...
    for (let i = 1; i < parts.length; i += 2) {
      sectionMap[parts[i]] = (parts[i + 1] || '').trim();
    }

    const sectionConfigs = [
      { name: '购物车', type: 'cart-list', defaultOpen: true },
      { name: '运输中', type: 'shipping', defaultOpen: false },
      { name: '寄退', type: 'return', defaultOpen: false },
      { name: '历史订单', type: 'orders', defaultOpen: false }
    ];

    let html = '';
    sectionConfigs.forEach((config, idx) => {
      const sectionText = sectionMap[config.name] || '';
      const items = sectionText.split('|||').map(s => s.trim()).filter(s => s);
      let bodyHtml = '';

      if (config.type === 'cart-list') {
        // 商品名 ||| 商品简介 (2 fields per item)
        // Heuristic: if "name" looks like a description, swap with desc
        const descPatterns = /(想买|需要|用来|适合|方便|因为|所以|觉得|可以|好看|好用|便宜|划算|喜欢|想要|准备|打算|最近)/;
        const count = Math.floor(items.length / 2);
        for (let g = 0; g < count; g++) {
          const i = g * 2;
          let name = items[i].replace(/\s+/g, ' ');
          let desc = items[i + 1].replace(/\s+/g, ' ');
          // If name contains description-like keywords but desc doesn't, swap
          if (descPatterns.test(name) && !descPatterns.test(desc)) {
            const tmp = name; name = desc; desc = tmp;
          }
          bodyHtml += `
            <div class="cart-item">
              <div class="cart-item-name">${escapeHtml(name)}</div>
              <div class="cart-item-desc">${escapeHtml(desc)}</div>
            </div>`;
        }
      } else if (config.type === 'shipping' || config.type === 'return') {
        // 商品名 ||| 运输状态 ||| 理由 (3 fields per item)
        // Known status keywords — if the AI puts one in the name field, swap
        const statusKeywords = /^(已发货|运输中|派送中|待取件|已揽收|在途|已下单|待发货|退货中|已揽件|退款处理中|已退款|退货申请中|待退货|已退回|处理中)$/;
        const count = Math.floor(items.length / 3);
        for (let g = 0; g < count; g++) {
          const i = g * 3;
          let name = items[i].replace(/\s+/g, ' ');
          let status = items[i + 1].replace(/\s+/g, ' ');
          const reason = items[i + 2].replace(/\s+/g, ' ');
          // Heuristic: if "name" is actually a status keyword, swap with status
          if (statusKeywords.test(name)) {
            const tmp = name; name = status; status = tmp;
          }
          bodyHtml += `
            <div class="cart-item">
              <div class="cart-item-top">
                <div class="cart-item-name">${escapeHtml(name)}</div>
                <div class="cart-status-badge">${escapeHtml(status)}</div>
              </div>
              <div class="cart-item-desc">${escapeHtml(reason)}</div>
            </div>`;
        }
      } else if (config.type === 'orders') {
        // 购买日期 ||| 商品名 ||| 购买理由 (3 fields per item)
        const count = Math.floor(items.length / 3);
        for (let g = 0; g < count; g++) {
          const i = g * 3;
          const date = items[i].replace(/\s+/g, ' ');
          const name = items[i + 1].replace(/\s+/g, ' ');
          const reason = items[i + 2].replace(/\s+/g, ' ');
          bodyHtml += `
            <div class="cart-timeline-item">
              <div class="cart-timeline-date">${escapeHtml(date)}</div>
              <div class="cart-timeline-name">${escapeHtml(name)}</div>
              <div class="cart-item-desc">${escapeHtml(reason)}</div>
            </div>`;
        }
      }

      html += `
        <div class="cart-section${config.defaultOpen ? '' : ' collapsed'}" data-section="${idx}">
          <div class="cart-section-header" onclick="toggleCartSection(${idx})">
            <div class="cart-section-title">${escapeHtml(config.name)}</div>
            <div class="cart-section-toggle">▼</div>
          </div>
          <div class="cart-section-body">${bodyHtml || '<div class="cart-item-desc">暂无内容</div>'}</div>
        </div>`;
    });

    listEl.className = '';
    listEl.innerHTML = html || '<div class="secret-loading">暂无内容</div>';
    if (html && state.secretModuleType === 'cart') {
      if (!state.secretCache) state.secretCache = {};
      state.secretCache.cart = html;
      showSecretActions('cart', html);
    }
  } catch(e) {
    if (genId !== state.secretGenId) return;
    listEl.className = '';
    listEl.innerHTML = `<div class="secret-loading">${escapeHtml(e.message || '生成失败，请检查API配置')}<br><button class="settings-action-btn" style="margin-top:12px;width:120px;" onclick="retrySecretGen('cart')">重试</button></div>`;
  }
}

// Pending secret: stored in state, survives tab switches until user decides
function removeSecretActions() {

function showSecretActions(type, html) {
  state.pendingSecret = { type, html, saved: false };
  const panel = document.querySelector('.secret-detail-panel-inner');
  if (!panel) return;
  // Remove old actions if any
  removeSecretActions();
  const actions = document.createElement('div');
  actions.className = 'secret-actions';
  actions.innerHTML = `
    <button class="secret-action-btn cancel" onclick="cancelSecret()">不记入</button>
    <button class="secret-action-btn save" onclick="confirmSecret()">记入档案</button>
  `;
  panel.appendChild(actions);
}

function confirmSecret() {
  if (!state.pendingSecret) return;
  saveSecretRecord(state.pendingSecret.type, state.pendingSecret.html);
  // Clear the cache entry so next click regenerates
  if (state.secretCache) {
    delete state.secretCache[state.pendingSecret.type];
  }
  state.pendingSecret = null;
  removeSecretActions();
  state.secretModuleType = null;
  renderSecretHome();
  showToast('已记入档案');
}

function cancelSecret() {
  if (state.pendingSecret && state.secretCache) {
    delete state.secretCache[state.pendingSecret.type];
  }
  state.pendingSecret = null;
  removeSecretActions();
  state.secretModuleType = null;
  renderSecretHome();
}

function handleAvatarUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    showToast('请选择图片文件');
    return;
  }
  if (file.size > 5 * 1024 * 1024) {
    showToast('图片不能超过5MB');
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e) {
    // Compress avatar via canvas to keep localStorage small
    // Use PNG (lossless) at 400px for retina sharpness — ~50-150KB typically
    const img = new Image();
    img.onload = function() {
      const maxDim = 400;
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const compressed = canvas.toDataURL('image/png');
      const frame = document.querySelector('.avatar-frame');
      if (frame) {
        frame.innerHTML = `<img src="${compressed}" alt="头像"><div class="avatar-frame-hint">更换头像</div>`;
      }
      // Only update a temporary preview variable; commit to state.data on saveCharacter()
      if (editorCharType) {
        editorPendingAvatar = compressed;
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

  c.background = document.getElementById('char-background').value.trim();
  c.other = document.getElementById('char-other').value.trim();
  // Commit pending avatar (or clear if user removed it)
  if (editorPendingAvatar !== null) {
    c.avatar = editorPendingAvatar;
  }
  editorPendingAvatar = null;
  saveToStorage();
  closeModal();
  renderSettings();
  showToast('人设已保存');
}

/* ========== API配置 ========== */
function showApiConfig() {
  const config = state.data.apiConfig;
  const active = config.active;

  showModal(`
    <div class="modal">
      <div class="modal-header">API配置</div>
      <div class="modal-body">
        <div class="api-tabs">
          <button class="api-tab ${active==='deepseek'?'active':''}" onclick="switchApiTab('deepseek')">DeepSeek</button>
          <button class="api-tab ${active==='gemini'?'active':''}" onclick="switchApiTab('gemini')">Gemini</button>
        </div>
        <div id="api-config-body"></div>
      </div>
      <div class="modal-footer">
        <button class="modal-btn" onclick="closeModal()">关闭</button>
        <button class="modal-btn primary" onclick="saveApiConfig()">保存</button>
      </div>
    </div>
  `);
  renderApiConfigBody(active);
}

function switchApiTab(tab) {
  state.data.apiConfig.active = tab;
  saveToStorage();
  document.querySelectorAll('.api-tab').forEach((btn, i) => {
    btn.classList.toggle('active', (i === 0 && tab === 'deepseek') || (i === 1 && tab === 'gemini'));
  });
  renderApiConfigBody(tab);
}

function renderApiConfigBody(tab) {
  const body = document.getElementById('api-config-body');
  const cfg = state.data.apiConfig[tab];
  const hasKey = !!cfg.apiKey;
  const placeholder = tab === 'deepseek' ? 'sk-...' : 'AIza...';

  // Build model selector: DeepSeek uses dropdown, Gemini uses text input
  let modelFieldHtml;
  if (tab === 'deepseek') {
    const models = [
      { value: 'deepseek-v4-flash', label: 'V4 Flash' },
      { value: 'deepseek-v4-pro', label: 'V4 Pro' }
    ];
    if (cfg.model && !models.find(m => m.value === cfg.model)) {
      models.push({ value: cfg.model, label: cfg.model });
    }
    const options = models.map(m =>
      `<option value="${m.value}" ${cfg.model === m.value ? 'selected' : ''}>${m.label}</option>`
    ).join('');
    modelFieldHtml = `<select class="form-input" id="api-model">${options}</select>`;
  } else {
    modelFieldHtml = `<input type="text" class="form-input" id="api-model" value="${escapeHtml(cfg.model)}" placeholder="输入模型名">`;
  }

  body.innerHTML = `
    <div class="form-group">
      <label class="form-label">API Key ${hasKey ? '<span class="api-status on">已配置</span>' : '<span class="api-status off">未配置</span>'}</label>
      <input type="password" class="form-input" id="api-key" value="${escapeHtml(cfg.apiKey)}" placeholder="${placeholder}">
    </div>
    <div class="form-group">
      <label class="form-label">模型</label>
      ${modelFieldHtml}
    </div>
    <div class="form-group">
      <label class="form-label">Base URL</label>
      <input type="text" class="form-input" id="api-baseurl" value="${escapeHtml(cfg.baseUrl)}">
    </div>
  `;
}

function saveApiConfig() {
  const tab = state.data.apiConfig.active;
  const cfg = state.data.apiConfig[tab];
  const keyEl = document.getElementById('api-key');
  const modelEl = document.getElementById('api-model');
  const urlEl = document.getElementById('api-baseurl');
  if (keyEl) cfg.apiKey = keyEl.value.trim();
  if (modelEl) cfg.model = modelEl.value.trim();
  if (urlEl) cfg.baseUrl = urlEl.value.trim();
  saveToStorage();
  closeModal();
  showToast('API配置已保存');
}

/* ========== 存档/读档 ========== */
const MANUAL_SLOTS = 5; // 5 manual save slots

// Get all saves (slots) from localStorage as an object keyed by slot id
// Automatically migrates/cleans up old array-format saves
function getAllSaves() {
  const raw = localStorage.getItem(SAVES_KEY);
  if (!raw) return {};
  const parsed = JSON.parse(raw);
  // Old format was an array — discard it and start fresh with slot-based object
  if (Array.isArray(parsed)) return {};
  return parsed;
}

function writeAllSaves(saves) {
  try {
    localStorage.setItem(SAVES_KEY, JSON.stringify(saves));
    return true;
  } catch(e) {
    console.error('存档写入失败', e);
    return false;
  }
}

function buildSaveData(slotLabel, name) {
  return {
    id: 'save_' + Date.now(),
    slot: slotLabel,
    name: name || '',
    timestamp: Date.now(),
    data: structuredClone(state.data)
  };
}

function formatSaveTime(ts) {
  if (!ts) return '空';
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function buildSaveSummary(data) {
  if (!data) return '';
  const chatCount = (data.chatHistory || []).length;
  const eventCount = (data.eventHistory || []).length;
  const memCount = (data.memoryCards || []).length;
  return `对话 ${chatCount} / 事件 ${eventCount} / 记忆 ${memCount}`;
}

// ========== 存档 ==========
function saveGame() {
  const saves = getAllSaves();
  let listHtml = '';
  for (let i = 1; i <= MANUAL_SLOTS; i++) {
    const slotId = 'slot_' + i;
    const existing = saves[slotId];
    const timeStr = existing ? formatSaveTime(existing.timestamp) : '空';
    const summary = existing ? buildSaveSummary(existing.data) : '';
    const overwriteHint = existing ? '（覆盖）' : '';
    const displayName = existing && existing.name ? escapeHtml(existing.name) : '槽位 ' + i;
    listHtml += `
      <div class="save-item" onclick="promptSaveName(${i})">
        <div class="save-info">
          <div class="save-time">${displayName} ${overwriteHint}</div>
          <div class="save-detail">${timeStr}${summary ? ' · ' + summary : ''}</div>
        </div>
        <span style="font-size:11px;color:var(--gold-faint);letter-spacing:2px;">存入</span>
      </div>
    `;
  }

  showModal(`
    <div class="modal">
      <div class="modal-header">存档</div>
      <div class="modal-body">
        <div class="save-list">${listHtml}</div>
      </div>
      <div class="modal-footer">
        <button class="modal-btn" onclick="closeModal()">取消</button>
      </div>
    </div>
  `);
}

// Prompt user to enter a save name before saving
function promptSaveName(slotNum) {
  const saves = getAllSaves();
  const slotId = 'slot_' + slotNum;
  const existing = saves[slotId];
  const existingName = existing && existing.name ? existing.name : '';

  showModal(`
    <div class="modal">
      <div class="modal-header">存入槽位 ${slotNum}</div>
      <div class="modal-body">
        <input type="text" id="save-name-input" class="save-name-input" placeholder="输入存档名..." value="${escapeHtml(existingName)}" onkeydown="if(event.key==='Enter')confirmSaveToSlot(${slotNum})">
      </div>
      <div class="modal-footer">
        <button class="modal-btn" onclick="saveGame()">返回</button>
        <button class="modal-btn primary" onclick="confirmSaveToSlot(${slotNum})">确认存入</button>
      </div>
    </div>
  `);
  // Auto-focus the input
  setTimeout(() => {
    const input = document.getElementById('save-name-input');
    if (input) {
      input.focus();
      input.select();
    }
  }, 100);
}

function confirmSaveToSlot(slotNum) {
  const nameInput = document.getElementById('save-name-input');
  const name = nameInput ? nameInput.value.trim() : '';
  const saves = getAllSaves();
  const slotId = 'slot_' + slotNum;
  saves[slotId] = buildSaveData(slotId, name);
  const ok = writeAllSaves(saves);
  closeModal();
  if (ok) {
    showToast('已存入「' + (name || '槽位 ' + slotNum) + '」');
  } else {
    showToast('存档失败：存储空间不足');
  }
}

// ========== 自动存档（完善记忆时触发） ==========
function autoSave() {
  const saves = getAllSaves();
  saves['slot_auto'] = buildSaveData('slot_auto');
  const ok = writeAllSaves(saves);
  if (!ok) {
    console.warn('自动存档失败：存储空间不足');
  }
  return ok;
}

// ========== 读档 ==========
function showLoadModal(fromHome) {
  const saves = getAllSaves();

  // Auto slot first
  const autoSave = saves['slot_auto'];
  let listHtml = '';

  // Auto save slot
  const autoTime = autoSave ? formatSaveTime(autoSave.timestamp) : '空';
  const autoSummary = autoSave ? buildSaveSummary(autoSave.data) : '';
  listHtml += `
    <div class="save-item auto-slot" onclick="confirmLoadSlot('slot_auto', ${fromHome})">
      <div class="save-info">
        <div class="save-time">自动存档</div>
        <div class="save-detail">${autoTime}${autoSummary ? ' · ' + autoSummary : ''}</div>
      </div>
      <span style="font-size:11px;color:var(--gold-faint);letter-spacing:2px;">载入</span>
    </div>
  `;

  // Manual slots
  for (let i = 1; i <= MANUAL_SLOTS; i++) {
    const slotId = 'slot_' + i;
    const existing = saves[slotId];
    const timeStr = existing ? formatSaveTime(existing.timestamp) : '空';
    const summary = existing ? buildSaveSummary(existing.data) : '';
    const isEmpty = !existing;
    const displayName = existing && existing.name ? escapeHtml(existing.name) : '槽位 ' + i;
    listHtml += `
      <div class="save-item ${isEmpty ? 'empty-slot' : ''}" ${isEmpty ? '' : `onclick="confirmLoadSlot('${slotId}', ${fromHome})"`}>
        <div class="save-info">
          <div class="save-time">${displayName}</div>
          <div class="save-detail">${timeStr}${summary ? ' · ' + summary : ''}</div>
        </div>
        ${isEmpty ? '<span style="font-size:11px;color:var(--text-faint);letter-spacing:2px;">空</span>' : '<span style="font-size:11px;color:var(--gold-faint);letter-spacing:2px;">载入</span>'}
      </div>
    `;
  }

  showModal(`
    <div class="modal">
      <div class="modal-header">加载存档</div>
      <div class="modal-body">
        <div class="save-list">${listHtml}</div>
      </div>
      <div class="modal-footer">
        <button class="modal-btn" onclick="closeModal()">关闭</button>
      </div>
    </div>
  `);
}

// Confirm before loading: current unsaved progress will be saved first
function confirmLoadSlot(slotId, fromHome) {
  const saves = getAllSaves();
  const save = saves[slotId];
  if (!save) {
    showToast('存档不存在');
    return;
  }
  const displayName = save.name || (slotId === 'slot_auto' ? '自动存档' : '存档');

  showModal(`
    <div class="modal">
      <div class="modal-header">载入存档</div>
      <div class="modal-body" style="text-align:center;color:var(--text-dim);font-size:13px;line-height:1.8;">
        当前进度将自动保存<br>确定加载「${escapeHtml(displayName)}」吗？
      </div>
      <div class="modal-footer">
        <button class="modal-btn" onclick="showLoadModal(${fromHome})">取消</button>
        <button class="modal-btn primary" onclick="loadFromSlot('${slotId}', ${fromHome})">确认载入</button>
      </div>
    </div>
  `);
}

function loadFromSlot(slotId, fromHome) {
  const saves = getAllSaves();
  const save = saves[slotId];
  if (!save) {
    showToast('存档不存在');
    return;
  }
  // Block if AI is generating to prevent data corruption
  if (state.isLoading) {
    showToast('正在生成中，请稍后再试');
    return;
  }
  // Save current progress before loading (prevent data loss)
  if (state.data) saveToStorage();
  state.data = deepMerge(structuredClone(DEFAULT_DATA), save.data);
  // Reset all runtime state to avoid stale leftovers
  state.eventState = 'idle';
  state.currentChainId = null;
  state.quoteContext = null;
  state.pendingSecret = null;
  state.secretModuleType = null;
  state.secretCache = null;
  state.chatSessionId++;
  state.rulesExpanded = false;
  saveToStorage();
  closeModal();
  if (fromHome) {
    document.getElementById('home-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'flex';
    // Force re-render all tabs by resetting currentTab
    state.currentTab = '';
    renderChat();
    renderBonds();
    renderMemory();
    renderSecretHome();
    renderSettings();
    state.currentTab = 'chat';
    document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
    document.getElementById('tab-chat').style.display = 'flex';
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === 'chat');
    });
  } else {
    // Already in game — re-render current tab
    state.currentTab = '';
    renderChat();
    renderBonds();
    renderMemory();
    renderSecretHome();
    renderSettings();
    state.currentTab = 'settings';
    document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
    document.getElementById('tab-settings').style.display = 'flex';
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === 'settings');
    });
  }
  showToast('读档成功');
}

function confirmReturnTitle() {
  showModal(`
    <div class="modal">
      <div class="modal-header">返回标题</div>
      <div class="modal-body" style="text-align:center;color:var(--text-dim);font-size:13px;">
        当前进度已自动保存，确定要返回标题界面吗？
      </div>
      <div class="modal-footer">
        <button class="modal-btn" onclick="closeModal()">取消</button>
        <button class="modal-btn primary" onclick="closeModal();returnToTitle()">确认</button>
      </div>
    </div>
  `);
}

/* ========== 启动 ========== */
init();
</script>
